name: AgentBox Obscura Linux candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-render:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      OPENSSL_NO_VENDOR: "1"
    steps:
      - name: Checkout exact selected source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Attest commit
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake libclang-dev libssl-dev llvm-dev pkg-config
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - name: Verify incremental SSE parser unit regressions
        run: |
          node --check crates/obscura-js/js/bootstrap.js
          node --test crates/obscura-js/tests/sse_parser.test.cjs
      - name: Verify bounded HTTP chunk reader callbacks
        run: |
          cargo test --locked -p obscura-js read_body_capped_delivers_chunks_before_end_of_response -- --nocapture
          cargo test --locked -p obscura-js read_body_capped_never_forwards_over_limit_chunk -- --nocapture
      - name: Run submit event and email regression tests
        run: cargo test --locked -p obscura-cdp --test integration submit_event_email_conformance -- --nocapture
      - name: Run submitter FormData regressions
        run: cargo test --locked -p obscura-cdp --test integration formdata_submitter_conformance -- --nocapture
      - name: Run Request.formData browser body regressions
        run: cargo test --locked -p obscura-cdp --test integration request_formdata_conformance -- --nocapture
      - name: Test slow module graph on unmounted SPA shell
        run: cargo test --locked -p obscura-browser populated_shell_without_form_controls_allows_slow_module_graph -- --nocapture
      - name: Verify classic script bounded transport retries
        # Keep V8 tests in separate processes rather than sharing isolates.
        run: |
          cargo test --locked -p obscura-browser classic_script_transient_get_retries_once_without_double_execution -- --nocapture
          cargo test --locked -p obscura-browser classic_script_persistent_transport_failure_stops_after_two_retries -- --nocapture
          cargo test --locked -p obscura-browser classic_script_http503_does_not_retry_or_execute -- --nocapture
      - name: Verify trusted native form submit parity
        run: cargo test --locked -p obscura-cdp --features render --test integration native_submit_event_trust -- --nocapture
      - name: Verify Response.formData compatibility
        # Separate native V8 test processes to avoid shared-isolate contamination.
        run: |
          cargo test --locked -p obscura-cdp --test integration response_formdata_conformance::urlencoded_response_formdata_decodes_and_consumes_once -- --exact --nocapture
          cargo test --locked -p obscura-cdp --test integration response_formdata_conformance::multipart_response_formdata_preserves_file_data -- --exact --nocapture
          cargo test --locked -p obscura-cdp --test integration response_formdata_conformance::response_formdata_rejects_unknown_content_type_and_clones_are_independent -- --exact --nocapture
          cargo test --locked -p obscura-cdp --test integration response_formdata_conformance::response_formdata_infers_multipart_mime_and_round_trips_entries -- --exact --nocapture
          cargo test --locked -p obscura-cdp --test integration response_formdata_conformance::response_bodyinit_infers_other_mime_types_without_overriding_explicit_header -- --exact --nocapture
      - name: Verify bounded module retry policy
        run: cargo test --locked -p obscura-js retry_policy_tests -- --nocapture
      - name: Verify existing module network events
        run: cargo test --locked -p obscura-cdp --test integration module_network_events -- --nocapture
      - name: Verify editable text insertion and field editing regressions
        # One named V8 test per invocation. Cargo test's default multi-test process
        # incorrectly shares the native V8 isolate across these fixtures.
        run: |
          cargo test --locked -p obscura-cdp --test integration textarea_enter_selection::insert_text_contenteditable_replaces_selection_and_respects_cancellation -- --exact --nocapture
          cargo test --locked -p obscura-cdp --test integration textarea_enter_selection::insert_text_contenteditable_does_not_replace_selection_outside_host -- --exact --nocapture
          cargo test --locked -p obscura-cdp --test integration textarea_enter_selection::insert_text_contenteditable_unicode_utf16_caret_and_nested_markup -- --exact --nocapture
          cargo test --locked -p obscura-cdp --test integration textarea_enter_selection::text_insertion_dispatches_cancelable_beforeinput_and_trusted_input_events -- --exact --nocapture
          cargo test --locked -p obscura-cdp --test integration textarea_enter_selection::canceled_or_readonly_text_insertion_preserves_value_and_selection -- --exact --nocapture
      - name: Build render-enabled Obscura binary
        run: cargo build --locked --release -p obscura-cli --bins --features render
      - name: Verify binary and fingerprint
        run: |
          test -x target/release/obscura
          target/release/obscura --version
          sha256sum target/release/obscura
      - name: Upload Linux candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: obscura-agentbox-response-module-retry-20261123-linux-x86_64
          path: target/release/obscura
          retention-days: 7